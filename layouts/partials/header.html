<header>
  <nav aria-label="Main navigation">
    <a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>

    <details>
      <summary>menu</summary>
      <ul>
        {{ range site.Menus.main }}
          <li>

          </li>
        {{ end }}
      </ul>
    </details>
  </nav>
</header>
