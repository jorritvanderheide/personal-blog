baseURL = 'https://bw20.nl'  # TODO: Update with your actual domain
languageCode = 'en-us'
title = 'Personal blog'

# Site parameters
[params]
  description = "A personal blog about data portability, NixOS, and technology"
  author = "Jorrit van der Heide"  # TODO: Update with your name

# Enable sitemap and robots.txt
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[[menus.main]]
identifier = 'articles'
name = 'articles'
url = '/articles'
weight = 20

[[menus.main]]
identifier = 'about'
name = 'about'
url = '/about'
weight = 30

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = 'gruvbox'
    tabWidth = 4