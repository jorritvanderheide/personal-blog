baseURL = 'http://localhost'
languageCode = 'en-us'
title = 'Personal blog'

[[menus.main]]
identifier = 'threads'
name = 'threads'
url = '/threads'
weight = 10

[[menus.main]]
identifier = 'bits'
name = 'bits'
url = '/bits'
weight = 20

[[menus.main]]
identifier = 'about'
name = 'about'
url = '/about'
weight = 30

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = 'gruvbox'
    tabWidth = 4