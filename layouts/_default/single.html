{{ define "main" }}
<article class="grid grid-cols-1 sm:grid-cols-4 lg:grid-cols-6 3xl:grid-cols-8">
  <div
    class="h-fit pb-6 sm:pb-8 pt-4 sm:pt-12 border-b-[1px] border-on-surface-dim sm:col-span-4 lg:col-span-6 flex flex-col gap-6 sm:gap-12 3xl:col-start-2"
  >
    <div class="px-4 sm:px-8 flex flex-col gap-6 sm:gap-4">
      <a href="{{ .CurrentSection.RelPermalink }}" class="text-lg sm:text-2xl lowercase">
        &#8249; {{ .CurrentSection.Title }}
      </a>
      <h1
        class="text-4xl sm:text-7xl lg:text-8xl leading-[120%] uppercase text-balance lg:w-5/6 3xl:w-2/3"
      >
        {{ .Title }}
      </h1>
      {{ with .Params.Summary }}
      <h2 class="text-3xl sm:text-5xl lg:text-6xl leading-[120%] text-balance lg:w-5/6 3xl:w-2/3">
        {{ . }}
      </h2>
      {{ end }}
    </div>
    <div class="w-full grid grid-cols-1 sm:grid-cols-4 lg:grid-cols-6">
      <time datetime="{{ .Date | dateFormat "2006-01-02" }}" class="hidden lg:block self-end px-8">
        {{ .Date | dateFormat "2006-01-02" }}
      </time>
    </div>
  </div>

  {{ with .TableOfContents }}
  <div class="hidden lg:block py-16 px-8 col-span-2 sm:col-span-1 lg:col-span-2 3xl:col-start-2 text-on-surface-dim">
    {{ . }}
  </div>
  {{ end }}

  <div
    class="lg:col-start-3 3xl:col-start-4 sm:col-span-4 lg:col-span-3 py-12 sm:py-16 px-4 sm:px-8 markdown"
  >
    {{ .Content }}
  </div>
</article>
{{ end }}
