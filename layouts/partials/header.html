<header>
  <nav aria-label="Breadcrumb">
    <a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    {{ if not .IsHome }}
      {{ if .IsPage }}
        {{ with .CurrentSection }}
          {{ if not .IsHome }}
            / <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ end }}
        {{ end }}
        / <span>{{ .Title }}</span>
      {{ else }}
        / <span>{{ .Title }}</span>
      {{ end }}
    {{ end }}
  </nav>
</header>
