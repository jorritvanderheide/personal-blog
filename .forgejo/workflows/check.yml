# The checks on every push to main and every pull request, on the Forgejo
# runner on dapple (label nix): Nix through dapple's daemon. The runner has
# no git, so the source comes as Codeberg's archive of the commit; without
# git there is no commit count, so the site's build number is left out. The
# module and its VM test are small-press's, and checked there.
#
# Not for a push that only changes content/, as every post published from
# Obsidian is: the receiver has run the site's checks on it before committing,
# and the deploy builds it after, alerting when it fails. A push that changes
# code as well is checked as always.
name: Check

on:
  push:
    branches: [main]
    paths-ignore: ['content/**']
  pull_request:

jobs:
  check:
    runs-on: nix
    timeout-minutes: 60
    steps:
      - name: Source
        run: curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz" | tar -xz --strip-components=1

      # gofmt, vet, the tests, staticcheck and govulncheck, as by hand.
      - name: check.sh
        run: nix develop -c ./check.sh

      # The program, and the site from the real content.
      - run: nix flake check -L
