baseURL = 'https://bw20.nl'
languageCode = 'en-US'
title = 'BW20'
disableHugoGeneratorInject = true

[params]
  description = "A personal blog about data portability, NixOS, and technology"
  author = "Jorrit van der Heide"
  siteCapacityKB = 1024
  pageBudgetKB = 16

[taxonomies]
  category = 'categories'

enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[[menus.main]]
  identifier = 'now'
  name = 'now'
  url = '/now'
  weight = 10
  [menus.main.params]
    description = 'what i am doing'

[[menus.main]]
  identifier = 'log'
  name = 'log'
  url = '/log'
  weight = 20
  [menus.main.params]
    description = 'field notes and essays'

[[menus.main]]
  identifier = 'threads'
  name = 'threads'
  url = '/categories'
  weight = 22
  [menus.main.params]
    description = 'ongoing conversations'

[[menus.main]]
  identifier = 'library'
  name = 'library'
  url = '/library'
  weight = 25
  [menus.main.params]
    description = 'links worth keeping'

[[menus.main]]
  identifier = 'about'
  name = 'about'
  url = '/about'
  weight = 30
  [menus.main.params]
    description = 'who, why'

[[menus.main]]
  identifier = 'colophon'
  name = 'colophon'
  url = '/colophon'
  weight = 40
  [menus.main.params]
    description = 'how this runs'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = 'gruvbox'
    tabWidth = 4
