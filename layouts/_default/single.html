{{ define "main" }}
  <article>
    <header>
      {{ with .CurrentSection }}
        <a href="{{ .RelPermalink }}">&lsaquo; {{ .Title }}</a>
      {{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Params.Summary }}
        <p>{{ . }}</p>
      {{ end }}
      <time datetime="{{ .Date | dateFormat "2006-01-02" }}">
        {{ .Date | dateFormat "2006-01-02" }}
      </time>
    </header>

    {{ with .TableOfContents }}
      <nav aria-label="Table of contents">
        {{ . }}
      </nav>
    {{ end }}

    <div>
      {{ .Content }}
    </div>
  </article>
{{ end }}
