{{define "main"}}
<article>
<header>
<h1>{{.Post.Title}}</h1>
<p class="meta"><time datetime="{{iso .Post.Date}}">{{date .Post.Date}}</time></p>
</header>
<p>This post was withdrawn on <time datetime="{{iso .Post.Withdrawn}}">{{date .Post.Withdrawn}}</time>. Its address stays, so links and citations to it still lead here, and you can still <a href="{{.Post.Path}}cite.bib" download>cite it</a>.</p>
</article>
{{end}}
