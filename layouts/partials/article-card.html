{{ $large := or .Params.large false }}
<article
  class="flex flex-col border-y-[1px] border-on-surface-dim overflow-hidden shadow-sm
  {{ if $large }}
    md:flex-row md:h-96
  {{ else }}
    md:p-8 h-auto
  {{ end }}
  "
>
  <!-- Image -->
  <div
    class="bg-accent-green {{ if $large }}
      md:w-1/2 md:h-full w-full h-48
    {{ else }}
      w-full h-48
    {{ end }}"
  >
    <img
      src="{{ .Params.cover }}"
      alt="{{ .Title }}"
      class="object-cover w-full h-full"
      loading="lazy"
    />
  </div>

  <!-- Text -->
  <div class="p-8 {{ if $large }}md:w-1/2 md:flex md:flex-col{{ end }}">
    <h3 class="text-xl font-bold">{{ .Title }}</h3>
    {{ with .Params.subtitle }}
      <p class="text-gray-600 mt-2">{{ . }}</p>
    {{ end }}
    <time
      datetime="{{ .Date | dateFormat "2006-01-02" }}"
      class="text-sm text-gray-400 mt-1"
    >
      {{ .Date | dateFormat "Jan 2, 2006" }}
    </time>
  </div>
</article>
