{{ $paginator := .Paginator }}

<nav aria-label="Pagination">
  <ul>
    {{ if $paginator.HasPrev }}
      <li>
        <a href="{{ $paginator.Prev.URL }}">&lsaquo; Previous</a>
      </li>
    {{ end }}

    {{ range $page := $paginator.Pagers }}
      <li>
        <a
          href="{{ $page.URL }}"
          {{ if eq $page $paginator }}aria-current="page"{{ end }}
        >
          {{ $page.PageNumber }}
        </a>
      </li>
    {{ end }}

    {{ if $paginator.HasNext }}
      <li>
        <a href="{{ $paginator.Next.URL }}">Next &rsaquo;</a>
      </li>
    {{ end }}
  </ul>
</nav>
