{{ define "main" }}
  {{ $freshness := partial "entry-age.html" .Date }}
  <article data-freshness="{{ $freshness }}">
    <header class="mb-8">
      {{ with .CurrentSection }}
        <a href="{{ .RelPermalink }}" class="text-sm text-fg-dim">&lsaquo; {{ .Title }}</a>
      {{ end }}
      <h1 class="mt-2">{{ .Title }}</h1>
      {{ with .Params.Summary }}
        <p class="text-fg-dim text-lg mt-2">{{ . }}</p>
      {{ end }}
      <span class="text-sm text-fg-dim">{{ partial "seasonal-time.html" .Date }}</span>
    </header>

    {{ with .TableOfContents }}
      <nav aria-label="Table of contents" class="mb-8 p-4 rounded bg-bg-soft text-sm">
        {{ . }}
      </nav>
    {{ end }}

    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
