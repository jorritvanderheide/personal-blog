baseURL = 'http://localhost'
languageCode = 'en-us'
title = 'Personal blog'

[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Bits'
pageRef = '/bits'
weight = 20

[[menus.main]]
name = 'MOCs'
pageRef = '/moc'
weight = 20

[[menus.main]]
name = 'Tags'
pageRef = '/tags'
weight = 30

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'