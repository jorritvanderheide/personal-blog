<header
  class="w-full h-16 lg:h-20 2xl:h-24 shrink-0 px-2 2xl:px-unit border-b-[1px] border-on-surface-dim"
>
  <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 h-full w-full">
    <a
      href="{{ .Site.Home.RelPermalink }}"
      class="grid-item col-span-1 sm:col-span-2 flex px-8 items-center sm:border-x-[1px] border-on-surface-dim bg-background font-bold text-2xl"
    >
      BW20
    </a>

    {{/* Mobile */}}
    <div
      class="hidden grid-item sm:flex px-8 items-center lg:hidden border-r-[1px] border-on-surface-dim"
    ></div>
    <div
      id="menuToggle"
      aria-label="Toggle menu"
      class="lg:hidden grid-item flex px-8 justify-end items-center hover:cursor-pointer"
    >
      menu
    </div>

    {{/* Desktop */}} {{ range .Site.Menus.main }} {{- $id := .Identifier -}} {{- if eq $id "bits"
    }}
    <a
      href="{{ .URL }}"
      class="hidden grid-item lg:flex px-8 items-center border-r-[1px] border-on-surface-dim hover:bg-on-surface-dim col-start-4"
    >
      {{ .Name }}
    </a>
    {{else if eq $id "mocs" }}
    <a
      href="{{ .URL }}"
      class="hidden grid-item lg:flex px-8 items-center border-r-[1px] border-on-surface-dim hover:bg-on-surface-dim col-start-5"
    >
      {{ .Name }}
    </a>
    {{ else if eq $id "about" }}
    <a
      href="{{ .URL }}"
      class="hidden grid-item lg:flex px-8 items-center border-r-[1px] border-on-surface-dim hover:bg-on-surface-dim col-start-6"
    >
      {{ .Name }}
    </a>
    {{ end }} {{ end }}
  </div>
</header>
