{{ define "main" }}
  <h1 class="mb-6">Threads</h1>
  {{ .Content }}

  <ul class="space-y-4">
    {{ range .Pages }}
      <li>
        <div class="flex items-baseline gap-3">
          <a href="{{ .RelPermalink }}" class="text-lg font-mono shrink-0">{{ .Title }}</a>
          <span class="text-fg-dim text-xs font-mono">{{ len .Pages }} {{ if eq (len .Pages) 1 }}entry{{ else }}entries{{ end }}</span>
        </div>
        {{ with .Params.description }}
          <p class="text-fg-dim text-sm mt-1">{{ . }}</p>
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
