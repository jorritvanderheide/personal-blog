# The Go checks, on every push and pull request, on Codeberg's shared
# runners. Their containers have no KVM and no Nix, so `nix flake check`,
# with the module's VM test, stays a local step. The checks are in
# check.sh, with the tools' versions.
on:
  push:
  pull_request:

jobs:
  go:
    # A job each, side by side: a codeberg-small runner gives a job five
    # minutes (https://codeberg.org/actions/meta), and building the two
    # tools takes most of that.
    name: ${{ matrix.check }}
    runs-on: codeberg-small
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check: [tests, staticcheck, govulncheck] # tests: gofmt, vet and the tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.26, as nixpkgs builds the site with; go.mod only
          # names the least.
          go-version: "1.26.x"
          check-latest: true
      - name: ${{ matrix.check }}
        run: ./check.sh ${{ matrix.check }} # as by hand
