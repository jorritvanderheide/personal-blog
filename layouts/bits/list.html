{{ define "main" }}
<article class="grid grid-cols-1 sm:grid-cols-4 lg:grid-cols-6 3xl:grid-cols-8">
    <div
    class="h-fit pb-12 sm:pb-16 pt-8 sm:pt-24 border-b-[1px] border-on-surface-dim sm:col-span-4 lg:col-span-6 flex flex-col gap-12 sm:gap-24 3xl:col-start-2"
    >
        <div class="px-4 sm:px-8">
            <h1 class="text-4xl sm:text-7xl lg:text-8xl leading-[120%] uppercase text-balance" >{{ .Title }}</h1>
            <p class="textf-lg sm:text-2xl">{{ .Content }}</p>
        </div>
    </div>

    <div
    class="h-fit pb-12 sm:pb-16 pt-8 sm:pt-24 border-b-[1px] border-on-surface-dim sm:col-span-4 lg:col-span-6 3xl:col-start-2"
  >

    <ul class="px-4 sm:px-8">
      {{ range where .Pages "Draft" false }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </div>
</article>
{{ end }}
