{{ $page := .Page }}

<article>
  <a href="{{ $page.RelPermalink }}">
    {{ with $page.Params.cover }}
      {{ $img := $page.Resources.GetMatch . }}
      {{ if $img }}
        <img
          src="{{ $img.RelPermalink }}"
          width="{{ $img.Width }}"
          height="{{ $img.Height }}"
          alt="{{ $page.Title }}"
          loading="lazy"
          decoding="async"
        />
      {{ end }}
    {{ end }}

    <h2>{{ $page.Title }}</h2>

    {{ with $page.Summary }}
      <p>{{ . | plainify | truncate 160 }}</p>
    {{ end }}

    <time datetime="{{ $page.Date | time.Format "2006-01-02" }}">
      {{ $page.Date | time.Format "Jan 2, 2006" }}
    </time>
  </a>
</article>
