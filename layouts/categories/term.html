{{ define "main" }}
  <h1 class="mb-2">{{ .Title }}</h1>
  {{ with .Params.description }}
    <p class="text-fg-dim mb-6">{{ . }}</p>
  {{ end }}
  <div class="mb-6">{{ .Content }}</div>

  {{ range .Pages.ByDate.Reverse }}
    {{ partial "article-card.html" (dict "Page" .) }}
  {{ end }}
{{ end }}
