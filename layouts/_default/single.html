{{ define "main" }}
  {{ $freshness := partial "entry-age.html" .Date }}
  <article data-freshness="{{ $freshness }}">
    <header>
      {{ with .CurrentSection }}
        <a href="{{ .RelPermalink }}">&lsaquo; {{ .Title }}</a>
      {{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Params.Summary }}
        <p>{{ . }}</p>
      {{ end }}
      {{ partial "seasonal-time.html" .Date }}
    </header>

    {{ with .TableOfContents }}
      <nav aria-label="Table of contents">
        {{ . }}
      </nav>
    {{ end }}

    <div>
      {{ .Content }}
    </div>
  </article>
{{ end }}
